<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf7a"/>
      <stop offset="0.5" stop-color="#f6b65e"/>
      <stop offset="1" stop-color="#e2934a"/>
    </linearGradient>
    <pattern id="floor" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="#efe0b6"/>
      <rect width="80" height="80" fill="#e6d4a6"/>
      <rect x="80" y="80" width="80" height="80" fill="#e6d4a6"/>
    </pattern>
    <g id="tread">
      <rect x="-60" y="-16" width="120" height="32" rx="12" fill="#2c2a26"/>
      <g stroke="#57534b" stroke-width="5">
        <line x1="-46" y1="-11" x2="-46" y2="11"/><line x1="-27" y1="-11" x2="-27" y2="11"/><line x1="-8" y1="-11" x2="-8" y2="11"/>
        <line x1="11" y1="-11" x2="11" y2="11"/><line x1="30" y1="-11" x2="30" y2="11"/><line x1="49" y1="-11" x2="49" y2="11"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="#fff3d6" opacity="0.18">
    <path d="M0 900 L420 0 L520 0 L100 900 Z"/>
    <path d="M1180 900 L1600 0 L1600 160 L1300 900 Z"/>
  </g>

  <!-- the board -->
  <rect x="150" y="262" width="1320" height="600" rx="26" fill="#5b4a2c"/>
  <rect x="140" y="250" width="1320" height="600" rx="26" fill="#6e5934"/>
  <rect x="170" y="280" width="1260" height="540" rx="8" fill="url(#floor)"/>

  <!-- walls: shadow, body, top edge -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#7a6438" stroke-width="30" opacity="0.45" transform="translate(7 9)">
      <path d="M170 280 H1430 V820 H170 Z"/>
      <path d="M490 280 V520 M330 520 H490 M810 400 V650 M650 650 H900 M1130 280 V440 M1130 600 V820 M970 520 H1290 M250 730 V820"/>
    </g>
    <g stroke="#3a3a30" stroke-width="26">
      <path d="M170 280 H1430 V820 H170 Z"/>
      <path d="M490 280 V520 M330 520 H490 M810 400 V650 M650 650 H900 M1130 280 V440 M1130 600 V820 M970 520 H1290 M250 730 V820"/>
    </g>
    <g stroke="#5a5a4c" stroke-width="8" transform="translate(-1 -5)">
      <path d="M490 280 V520 M330 520 H490 M810 400 V650 M650 650 H900 M1130 280 V440 M1130 600 V820 M970 520 H1290 M250 730 V820"/>
    </g>
  </g>

  <!-- a bank shot: out of the red tank, off two walls, toward the blue one -->
  <g fill="none" stroke="#e0473c" stroke-width="7" stroke-dasharray="4 22" stroke-linecap="round" opacity="0.85">
    <path d="M420 600 L776 410 L960 532 L1100 470"/>
  </g>
  <g stroke-linecap="round">
    <g stroke="#ffb347" stroke-width="7"><line x1="782" y1="414" x2="742" y2="388"/><line x1="782" y1="414" x2="748" y2="440"/><line x1="782" y1="414" x2="736" y2="414"/></g>
    <g stroke="#fff3b0" stroke-width="5"><line x1="960" y1="530" x2="984" y2="568"/><line x1="960" y1="530" x2="940" y2="572"/><line x1="960" y1="530" x2="1000" y2="548"/></g>
  </g>
  <circle cx="776" cy="412" r="22" fill="#fff7cf" opacity="0.8"/>
  <circle cx="960" cy="532" r="18" fill="#fff7cf" opacity="0.8"/>
  <circle cx="1100" cy="470" r="17" fill="#2b2a22"/>
  <circle cx="1100" cy="470" r="13" fill="#e0473c"/>
  <circle cx="1100" cy="470" r="6" fill="#fffbea"/>

  <!-- red tank, aiming up-right -->
  <g transform="translate(360 640) rotate(-28)">
    <rect x="-62" y="-52" width="132" height="120" rx="26" fill="#5b3a14" opacity="0.3" transform="translate(8 10)"/>
    <use href="#tread" y="-44"/><use href="#tread" y="44"/>
    <rect x="-50" y="-36" width="100" height="72" rx="16" fill="#e0473c" stroke="#7d1f18" stroke-width="7"/>
    <rect x="-34" y="-24" width="40" height="16" rx="6" fill="#f08a80"/>
    <rect x="6" y="-11" width="74" height="22" rx="6" fill="#7d1f18"/>
    <rect x="70" y="-14" width="18" height="28" rx="4" fill="#26241f"/>
    <circle r="28" fill="#e6604f" stroke="#7d1f18" stroke-width="7"/>
    <circle cx="-4" r="10" fill="#b0342a"/>
  </g>

  <!-- blue tank, ducking behind a wall -->
  <g transform="translate(1260 380) rotate(160)">
    <rect x="-62" y="-52" width="132" height="120" rx="26" fill="#5b3a14" opacity="0.3" transform="translate(8 10)"/>
    <use href="#tread" y="-44"/><use href="#tread" y="44"/>
    <rect x="-50" y="-36" width="100" height="72" rx="16" fill="#3a8fe0" stroke="#173f6a" stroke-width="7"/>
    <rect x="-34" y="-24" width="40" height="16" rx="6" fill="#86bdf0"/>
    <rect x="6" y="-11" width="74" height="22" rx="6" fill="#173f6a"/>
    <rect x="70" y="-14" width="18" height="28" rx="4" fill="#26241f"/>
    <circle r="28" fill="#5aa2e6" stroke="#173f6a" stroke-width="7"/>
    <circle cx="-4" r="10" fill="#2b6fb3"/>
  </g>

  <!-- yellow tank, rolling in -->
  <g transform="translate(1010 745) rotate(180)">
    <rect x="-62" y="-52" width="132" height="120" rx="26" fill="#5b3a14" opacity="0.3" transform="translate(8 10)"/>
    <use href="#tread" y="-44"/><use href="#tread" y="44"/>
    <rect x="-50" y="-36" width="100" height="72" rx="16" fill="#f2c230" stroke="#7a5b08" stroke-width="7"/>
    <rect x="-34" y="-24" width="40" height="16" rx="6" fill="#f8de85"/>
    <rect x="6" y="-11" width="74" height="22" rx="6" fill="#7a5b08"/>
    <rect x="70" y="-14" width="18" height="28" rx="4" fill="#26241f"/>
    <circle r="28" fill="#f5cd4e" stroke="#7a5b08" stroke-width="7"/>
    <circle cx="-4" r="10" fill="#c99a12"/>
  </g>

  <!-- title -->
  <g font-family="'Arial Black', 'Segoe UI', sans-serif" font-weight="900" text-anchor="middle">
    <text x="806" y="186" font-size="116" fill="#7a3d14" opacity="0.55">RICOCHET TANKS</text>
    <text x="800" y="178" font-size="116" fill="#fff7e6" stroke="#3a2a14" stroke-width="10" paint-order="stroke">RICOCHET TANKS</text>
  </g>
</svg>
