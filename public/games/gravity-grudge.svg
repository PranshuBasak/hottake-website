  <g><rect x="880" y="100" width="60" height="70" fill="#3c8de8"/><rect x="888" y="156" width="44" height="34" fill="#e6f0ff"/><rect x="896" y="164" width="34" height="18" fill="#0a1030"/><rect x="904" y="166" width="14" height="14" fill="#7dffff"/><rect x="870" y="118" width="14" height="40" fill="#2b3150"/><rect x="890" y="82" width="14" height="10" fill="#2b3150"/><rect x="916" y="82" width="14" height="10" fill="#2b3150"/></g>
