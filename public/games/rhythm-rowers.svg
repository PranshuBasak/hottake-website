<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf8a"/>
      <stop offset="1" stop-color="#ffe9c2"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22a9b9"/>
      <stop offset="1" stop-color="#147f92"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e4"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
  </defs>

  <!-- warm sky and hills -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1310" cy="230" r="110" fill="#fff3cf"/>
  <path d="M0 330 C200 250 380 260 560 310 C760 250 980 230 1180 300 C1340 260 1480 270 1600 300 L1600 420 L0 420 Z" fill="#9fcf6a"/>
  <path d="M0 380 C220 330 460 350 700 380 C940 340 1200 340 1600 370 L1600 440 L0 440 Z" fill="#6fb24e"/>
  <!-- far trees -->
  <g fill="#4d9440">
    <circle cx="120" cy="360" r="34"/><circle cx="170" cy="350" r="28"/><circle cx="900" cy="350" r="30"/>
    <circle cx="950" cy="362" r="24"/><circle cx="1450" cy="350" r="32"/><circle cx="1500" cy="362" r="26"/>
  </g>

  <!-- the river -->
  <rect y="420" width="1600" height="420" fill="url(#water)"/>
  <rect y="410" width="1600" height="16" fill="#3d8338"/>
  <!-- lane rope -->
  <g fill="#fff4e0">
    <circle cx="40" cy="630" r="9"/><circle cx="120" cy="630" r="9"/><circle cx="280" cy="630" r="9"/><circle cx="360" cy="630" r="9"/>
    <circle cx="520" cy="630" r="9"/><circle cx="600" cy="630" r="9"/><circle cx="760" cy="630" r="9"/><circle cx="840" cy="630" r="9"/>
    <circle cx="1000" cy="630" r="9"/><circle cx="1080" cy="630" r="9"/><circle cx="1240" cy="630" r="9"/><circle cx="1320" cy="630" r="9"/>
  </g>
  <g fill="#ff4d4d">
    <circle cx="200" cy="630" r="9"/><circle cx="440" cy="630" r="9"/><circle cx="680" cy="630" r="9"/><circle cx="920" cy="630" r="9"/>
    <circle cx="1160" cy="630" r="9"/>
  </g>
  <!-- ripples -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.3">
    <path d="M90 480 q30 -6 60 0"/><path d="M420 700 q30 -6 60 0"/><path d="M980 470 q30 -6 60 0"/>
    <path d="M760 780 q30 -6 60 0"/><path d="M1180 720 q30 -6 60 0"/><path d="M260 800 q30 -6 60 0"/>
  </g>
  <!-- rapids -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7">
    <path d="M1100 660 l14 14 l-14 14"/><path d="M1150 700 l14 14 l-14 14"/><path d="M1080 740 l14 14 l-14 14"/>
    <path d="M1200 650 l14 14 l-14 14"/><path d="M1130 790 l14 14 l-14 14"/>
  </g>
  <!-- rocks -->
  <g>
    <ellipse cx="960" cy="520" rx="70" ry="34" fill="#ffffff" opacity="0.45"/>
    <path d="M920 520 l14 -30 l38 -10 l30 16 l8 26 l-22 22 l-44 4 Z" fill="#6c707f" stroke="#3d404b" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="950" cy="502" rx="20" ry="10" fill="#9399aa"/>
    <ellipse cx="700" cy="805" rx="62" ry="30" fill="#ffffff" opacity="0.45"/>
    <path d="M666 805 l12 -26 l34 -8 l26 14 l6 22 l-20 20 l-38 2 Z" fill="#6c707f" stroke="#3d404b" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <!-- finish line -->
  <g>
    <rect x="1420" y="426" width="22" height="414" fill="#ffffff"/>
    <g fill="#1d1d24">
      <rect x="1420" y="426" width="22" height="22"/><rect x="1420" y="470" width="22" height="22"/><rect x="1420" y="514" width="22" height="22"/>
      <rect x="1420" y="558" width="22" height="22"/><rect x="1420" y="602" width="22" height="22"/><rect x="1420" y="646" width="22" height="22"/>
      <rect x="1420" y="690" width="22" height="22"/><rect x="1420" y="734" width="22" height="22"/><rect x="1420" y="778" width="22" height="22"/>
      <rect x="1420" y="822" width="22" height="18"/>
      <rect x="1442" y="448" width="22" height="22"/><rect x="1442" y="492" width="22" height="22"/><rect x="1442" y="536" width="22" height="22"/>
      <rect x="1442" y="580" width="22" height="22"/><rect x="1442" y="624" width="22" height="22"/><rect x="1442" y="668" width="22" height="22"/>
      <rect x="1442" y="712" width="22" height="22"/><rect x="1442" y="756" width="22" height="22"/><rect x="1442" y="800" width="22" height="22"/>
    </g>
    <rect x="1442" y="426" width="22" height="22" fill="#ffffff"/>
    <rect x="1472" y="300" width="10" height="130" fill="#5a3b22"/>
    <path d="M1482 302 l80 22 l-80 26 Z" fill="#ff4d6d"/>
  </g>

  <!-- boat 1: coral, two rowers -->
  <g transform="translate(700 540) rotate(-4)">
    <path d="M-230 30 l-90 6 M-230 -30 l-90 -6" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="6" cy="10" rx="220" ry="40" fill="#0a5563" opacity="0.3"/>
    <path d="M230 0 Q170 -42 20 -40 L-190 -38 Q-226 -36 -226 0 Q-226 36 -190 38 L20 40 Q170 42 230 0 Z" fill="#ff6b4a" stroke="#8c2a17" stroke-width="7"/>
    <path d="M196 0 Q150 -26 20 -26 L-180 -26 Q-206 -24 -206 0 Q-206 24 -180 26 L20 26 Q150 26 196 0 Z" fill="#f2d7a0"/>
    <ellipse cx="200" cy="-15" rx="12" ry="8" fill="#fff"/><circle cx="203" cy="-15" r="5" fill="#1d1d24"/>
    <ellipse cx="200" cy="15" rx="12" ry="8" fill="#fff"/><circle cx="203" cy="15" r="5" fill="#1d1d24"/>
    <!-- oars -->
    <g stroke="#7a4e2a" stroke-width="10" stroke-linecap="round">
      <path d="M60 -30 L-10 -150"/><path d="M60 30 L-10 150"/>
      <path d="M-90 -30 L-170 -140"/><path d="M-90 30 L-170 140"/>
    </g>
    <g fill="#ffd6c9" stroke="#8c2a17" stroke-width="5">
      <ellipse cx="-16" cy="-162" rx="30" ry="16" transform="rotate(-60 -16 -162)"/><ellipse cx="-16" cy="162" rx="30" ry="16" transform="rotate(60 -16 162)"/>
      <ellipse cx="-176" cy="-152" rx="30" ry="16" transform="rotate(-54 -176 -152)"/><ellipse cx="-176" cy="152" rx="30" ry="16" transform="rotate(54 -176 152)"/>
    </g>
    <!-- rowers -->
    <ellipse cx="50" cy="0" rx="26" ry="36" fill="#3b82f6"/><circle cx="66" cy="0" r="20" fill="#f6cfa2"/><path d="M66 -20 A20 20 0 0 0 66 20 Z" fill="#2563eb"/>
    <ellipse cx="-100" cy="0" rx="26" ry="36" fill="#22c55e"/><circle cx="-84" cy="0" r="20" fill="#f6cfa2"/><path d="M-84 -20 A20 20 0 0 0 -84 20 Z" fill="#16a34a"/>
    <!-- splashes -->
    <g fill="#ffffff"><circle cx="-40" cy="-176" r="9"/><circle cx="-60" cy="-160" r="6"/><circle cx="-40" cy="176" r="9"/><circle cx="-60" cy="160" r="6"/></g>
  </g>

  <!-- boat 2: teal, solo -->
  <g transform="translate(330 770) rotate(3) scale(0.82)">
    <ellipse cx="6" cy="10" rx="220" ry="40" fill="#0a5563" opacity="0.3"/>
    <path d="M230 0 Q170 -42 20 -40 L-190 -38 Q-226 -36 -226 0 Q-226 36 -190 38 L20 40 Q170 42 230 0 Z" fill="#14b8a6" stroke="#0b5a52" stroke-width="7"/>
    <path d="M196 0 Q150 -26 20 -26 L-180 -26 Q-206 -24 -206 0 Q-206 24 -180 26 L20 26 Q150 26 196 0 Z" fill="#f2d7a0"/>
    <ellipse cx="200" cy="-15" rx="12" ry="8" fill="#fff"/><circle cx="203" cy="-15" r="5" fill="#1d1d24"/>
    <ellipse cx="200" cy="15" rx="12" ry="8" fill="#fff"/><circle cx="203" cy="15" r="5" fill="#1d1d24"/>
    <g stroke="#7a4e2a" stroke-width="10" stroke-linecap="round"><path d="M-10 -30 L40 -150"/><path d="M-10 30 L40 150"/></g>
    <g fill="#c8f3ec" stroke="#0b5a52" stroke-width="5">
      <ellipse cx="46" cy="-162" rx="30" ry="16" transform="rotate(-110 46 -162)"/><ellipse cx="46" cy="162" rx="30" ry="16" transform="rotate(110 46 162)"/>
    </g>
    <ellipse cx="-20" cy="0" rx="26" ry="36" fill="#f59e0b"/><circle cx="-4" cy="0" r="20" fill="#f6cfa2"/><path d="M-4 -20 A20 20 0 0 0 -4 20 Z" fill="#d97706"/>
  </g>

  <!-- the near bank -->
  <rect y="850" width="1600" height="50" fill="#e9cb8b"/>
  <rect y="840" width="1600" height="14" fill="#4f9e45"/>
  <g fill="#d4b072"><ellipse cx="160" cy="878" rx="9" ry="5"/><ellipse cx="620" cy="884" rx="8" ry="5"/><ellipse cx="1040" cy="876" rx="9" ry="5"/><ellipse cx="1500" cy="882" rx="8" ry="5"/></g>

  <!-- the drum on the bank, with beat rings -->
  <g transform="translate(1180 360)">
    <ellipse cx="0" cy="-34" rx="150" ry="46" fill="none" stroke="#fff3cf" stroke-width="8" opacity="0.6"/>
    <ellipse cx="0" cy="-34" rx="200" ry="66" fill="none" stroke="#fff3cf" stroke-width="5" opacity="0.35"/>
    <path d="M-92 -34 Q-110 10 -88 46 L88 46 Q110 10 92 -34 Z" fill="#a8322a"/>
    <rect x="-82" y="-24" width="164" height="56" fill="#c8432f"/>
    <path d="M-82 40 L-66 -22 L-50 40 L-34 -22 L-18 40 L-2 -22 L14 40 L30 -22 L46 40 L62 -22 L78 40" fill="none" stroke="#ffd36b" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-34" rx="94" ry="26" fill="#fbf1da" stroke="#6e1f1a" stroke-width="8"/>
    <g transform="translate(120 -110) rotate(30)"><rect x="-8" y="0" width="16" height="104" fill="#8a5a32"/><ellipse cx="0" cy="112" rx="18" ry="15" fill="#f2e6d0"/></g>
  </g>

  <!-- title -->
  <g font-family="'Arial Black', 'Segoe UI', sans-serif" font-weight="900" text-anchor="middle">
    <text x="806" y="168" font-size="128" fill="#5a2a12" opacity="0.4" letter-spacing="4">RHYTHM ROWERS</text>
    <text x="800" y="160" font-size="128" fill="url(#title)" stroke="#5a2a12" stroke-width="12" paint-order="stroke" letter-spacing="4">RHYTHM ROWERS</text>
  </g>
</svg>
