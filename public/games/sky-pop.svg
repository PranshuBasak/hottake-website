<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa9ee"/>
      <stop offset="0.7" stop-color="#8fd3f8"/>
      <stop offset="1" stop-color="#c9eeff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79d14a"/>
      <stop offset="1" stop-color="#3f9e34"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6a3e"/>
      <stop offset="1" stop-color="#6c4528"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27b8d8"/>
      <stop offset="1" stop-color="#0c7fb3"/>
    </linearGradient>
    <g id="cloud" fill="#ffffff">
      <circle cx="-90" cy="16" r="50"/><circle cx="-40" cy="-8" r="64"/><circle cx="26" cy="-18" r="74"/><circle cx="92" cy="6" r="56"/><circle cx="0" cy="26" r="62"/>
    </g>
    <g id="island" stroke="#23304f" stroke-width="6" stroke-linejoin="round">
      <path d="M6 34 L36 90 L110 136 L164 180 L210 200 L264 130 L350 104 L394 34 Z" fill="url(#rock)"/>
      <rect x="0" y="0" width="400" height="40" rx="14" fill="url(#grass)"/>
    </g>
    <g id="pigeon" stroke="#23304f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-26 2 L-48 6 L-46 22 L-24 16 Z" fill="#6e7699"/>
      <ellipse cx="0" cy="4" rx="33" ry="26" fill="#9aa2c4"/>
      <ellipse cx="7" cy="12" rx="20" ry="12" fill="#d3d7ec" stroke="none"/>
      <path d="M10 0 L-14 14 L-4 -2 Z" style="fill:var(--c)"/>
      <ellipse cx="17" cy="-2" rx="12" ry="7" transform="rotate(52 17 -2)" style="fill:var(--c)"/>
      <ellipse cx="18" cy="-9" rx="9" ry="8" fill="#5fb09a" stroke="none"/>
      <circle cx="25" cy="-17" r="15" fill="#9aa2c4"/>
      <path d="M38 -19 L52 -13 L38 -9 Z" fill="#f4ad3d"/>
      <path d="M10 -22 Q25 -30 40 -22" fill="none" style="stroke:var(--c)" stroke-width="7"/>
      <circle cx="31" cy="-19" r="9" fill="#d7f2ff"/>
      <circle cx="33" cy="-19" r="3" fill="#23304f" stroke="none"/>
      <ellipse cx="-18" cy="2" rx="30" ry="12" transform="rotate(-50 -4 -2)" fill="#7983ab"/>
    </g>
    <g id="balloon" stroke="#23304f" stroke-width="4" stroke-linejoin="round">
      <ellipse cx="0" cy="0" rx="26" ry="30" style="fill:var(--c)"/>
      <path d="M0 29 L-6 39 L6 39 Z" style="fill:var(--c)" stroke-width="3"/>
      <ellipse cx="-9" cy="-12" rx="6" ry="10" transform="rotate(30 -9 -12)" fill="#fff" fill-opacity="0.75" stroke="none"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <use href="#cloud" x="250" y="250" transform="translate(0 0) scale(1)"/>
  <use href="#cloud" x="1380" y="210"/>
  <use href="#cloud" x="880" y="720" opacity="0.9"/>
  <use href="#island" x="140" y="560"/>
  <use href="#island" x="1060" y="560"/>
  <!-- the pigeons, each hanging from two balloons in its own seat colour -->
  <g style="--c:#e8402c">
    <g transform="translate(330 430) scale(1.5)">
      <line x1="0" y1="-24" x2="-18" y2="-40" stroke="#fff" stroke-width="2.5"/><line x1="0" y1="-24" x2="18" y2="-40" stroke="#fff" stroke-width="2.5"/>
      <use href="#balloon" x="-18" y="-70"/><use href="#balloon" x="18" y="-70"/>
      <use href="#pigeon"/>
      <circle cx="4" cy="10" r="15" fill="#e8402c" stroke="#fff" stroke-width="3"/>
      <text x="4" y="11" font-family="sans-serif" font-weight="bold" font-size="24" fill="#fff" text-anchor="middle" dominant-baseline="middle">1</text>
    </g>
  </g>
  <g style="--c:#2f8be8">
    <g transform="translate(1260 330) scale(1.5)">
      <use href="#balloon" x="-18" y="-70"/><use href="#balloon" x="18" y="-70"/>
      <use href="#pigeon"/>
      <circle cx="4" cy="10" r="15" fill="#2f8be8" stroke="#fff" stroke-width="3"/>
      <text x="4" y="11" font-family="sans-serif" font-weight="bold" font-size="24" fill="#fff" text-anchor="middle" dominant-baseline="middle">2</text>
    </g>
  </g>
  <g style="--c:#f2c230">
    <g transform="translate(800 520) scale(-1.5 1.5)">
      <use href="#balloon" x="-18" y="-70"/>
      <use href="#pigeon"/>
    </g>
    <circle cx="794" cy="535" r="22" fill="#f2c230" stroke="#23304f" stroke-width="3"/>
    <text x="794" y="536" font-family="sans-serif" font-weight="bold" font-size="30" fill="#000" text-anchor="middle" dominant-baseline="middle">3</text>
  </g>
  <!-- a pop -->
  <polygon points="1002,246 1030,258 1038,230 1056,254 1086,240 1072,268 1100,284 1070,292 1082,318 1054,306 1040,334 1030,306 1000,318 1012,290 984,278 1010,268" fill="#ffd23f" stroke="#23304f" stroke-width="4"/>
  <circle cx="1042" cy="282" r="20" fill="#fff6c8"/>
  <path d="M0 800 Q20 784 40 800 T80 800 T120 800 T160 800 T200 800 T240 800 T280 800 T320 800 T360 800 T400 800 T440 800 T480 800 T520 800 T560 800 T600 800 T640 800 T680 800 T720 800 T760 800 T800 800 T840 800 T880 800 T920 800 T960 800 T1000 800 T1040 800 T1080 800 T1120 800 T1160 800 T1200 800 T1240 800 T1280 800 T1320 800 T1360 800 T1400 800 T1440 800 T1480 800 T1520 800 T1560 800 T1600 800 V900 H0 Z" fill="url(#sea)"/>
  <path d="M0 800 Q20 784 40 800 T80 800 T120 800 T160 800 T200 800 T240 800 T280 800 T320 800 T360 800 T400 800 T440 800 T480 800 T520 800 T560 800 T600 800 T640 800 T680 800 T720 800 T760 800 T800 800 T840 800 T880 800 T920 800 T960 800 T1000 800 T1040 800 T1080 800 T1120 800 T1160 800 T1200 800 T1240 800 T1280 800 T1320 800 T1360 800 T1400 800 T1440 800 T1480 800 T1520 800 T1560 800 T1600 800" fill="none" stroke="#fff" stroke-width="5" stroke-opacity="0.85"/>
</svg>
