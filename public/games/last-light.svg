<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f3a"/>
      <stop offset="0.6" stop-color="#4a2466"/>
      <stop offset="1" stop-color="#c2546e"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7a0" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffb347" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset="1" stop-color="#ffab3d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c4"/>
      <stop offset="1" stop-color="#ffa63a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- stars and a crescent moon -->
  <g fill="#fff3d8">
    <circle cx="120" cy="250" r="4"/><circle cx="260" cy="330" r="3"/><circle cx="420" cy="240" r="3"/>
    <circle cx="1120" cy="300" r="3"/><circle cx="1500" cy="380" r="4"/><circle cx="1260" cy="230" r="3"/>
    <circle cx="60" cy="400" r="3"/><circle cx="560" cy="320" r="3"/><circle cx="980" cy="260" r="3"/>
  </g>
  <circle cx="1380" cy="260" r="62" fill="#ffefd0"/>
  <circle cx="1406" cy="244" r="56" fill="#1e1544"/>
  <!-- hills and the village -->
  <path d="M0 600 Q200 540 420 590 T860 580 T1260 570 T1600 590 V900 H0 Z" fill="#2a1d4e"/>
  <g fill="#1c1438">
    <rect x="90" y="560" width="130" height="90"/><polygon points="76,560 155,500 234,560"/>
    <rect x="300" y="590" width="100" height="70"/><polygon points="288,590 350,545 412,590"/>
    <rect x="1200" y="575" width="120" height="80"/><polygon points="1186,575 1260,520 1334,575"/>
    <rect x="1400" y="555" width="140" height="96"/><polygon points="1386,555 1470,494 1554,555"/>
    <polygon points="520,640 560,520 600,640"/><polygon points="1050,640 1090,530 1130,640"/>
  </g>
  <g fill="#ffbe5c" opacity="0.75">
    <rect x="120" y="590" width="20" height="24" rx="3"/><rect x="330" y="610" width="16" height="20" rx="3"/>
    <rect x="1230" y="600" width="18" height="22" rx="3"/><rect x="1480" y="585" width="20" height="24" rx="3"/>
  </g>
  <!-- the ground -->
  <rect x="0" y="740" width="1600" height="160" fill="#2e2440"/>
  <rect x="0" y="740" width="1600" height="16" fill="#4f6e46"/>
  <g fill="#3a2f50">
    <rect x="30" y="776" width="120" height="40" rx="10"/><rect x="190" y="776" width="120" height="40" rx="10"/>
    <rect x="1290" y="776" width="120" height="40" rx="10"/><rect x="1450" y="776" width="120" height="40" rx="10"/>
    <rect x="110" y="836" width="120" height="40" rx="10"/><rect x="1370" y="836" width="120" height="40" rx="10"/>
  </g>
  <!-- the lantern's light -->
  <circle cx="800" cy="520" r="420" fill="url(#light)"/>
  <!-- the lantern -->
  <rect x="740" y="712" width="120" height="32" rx="8" fill="#5c5280"/>
  <rect x="790" y="560" width="20" height="160" fill="#1e1a2c"/>
  <polygon points="736,420 800,370 864,420" fill="#24203a"/>
  <rect x="792" y="346" width="16" height="30" fill="#24203a"/>
  <rect x="744" y="420" width="112" height="124" fill="url(#glass)" stroke="#24203a" stroke-width="10"/>
  <line x1="800" y1="420" x2="800" y2="544" stroke="#24203a" stroke-width="8"/>
  <rect x="732" y="540" width="136" height="20" fill="#24203a"/>
  <ellipse cx="800" cy="496" rx="22" ry="40" fill="#ff8a3d"/>
  <ellipse cx="800" cy="506" rx="11" ry="22" fill="#fff5c8"/>
  <!-- two lamplighters guarding it -->
  <g>
    <path d="M560 740 L572 640 Q600 600 628 640 L640 740 Z" fill="#ff5c8a"/>
    <circle cx="606" cy="650" r="17" fill="#f2dcc0"/>
    <rect x="612" y="644" width="5" height="7" fill="#2a1d2a"/>
    <line x1="648" y1="610" x2="700" y2="560" stroke="#7a5634" stroke-width="9" stroke-linecap="round"/>
    <path d="M660 540 A110 110 0 0 1 740 640" fill="none" stroke="#fff3c0" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
  </g>
  <g>
    <path d="M960 740 L972 640 Q1000 600 1028 640 L1040 740 Z" fill="#46c4ff"/>
    <circle cx="994" cy="650" r="17" fill="#f2dcc0"/>
    <rect x="983" y="644" width="5" height="7" fill="#2a1d2a"/>
    <line x1="952" y1="740" x2="952" y2="600" stroke="#7a5634" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- crawlers creeping in from both sides -->
  <g fill="#1a1226">
    <path d="M250 744 Q250 680 320 680 Q390 680 390 744 Z"/>
    <path d="M70 744 Q70 694 125 694 Q180 694 180 744 Z"/>
    <path d="M1210 744 Q1210 680 1280 680 Q1350 680 1350 744 Z"/>
    <path d="M1420 744 Q1420 694 1475 694 Q1530 694 1530 744 Z"/>
  </g>
  <g fill="#ffb02e">
    <ellipse cx="350" cy="708" rx="7" ry="5"/><ellipse cx="370" cy="708" rx="7" ry="5"/>
    <ellipse cx="150" cy="716" rx="6" ry="4"/><ellipse cx="166" cy="716" rx="6" ry="4"/>
    <ellipse cx="1230" cy="708" rx="7" ry="5"/><ellipse cx="1250" cy="708" rx="7" ry="5"/>
    <ellipse cx="1434" cy="716" rx="6" ry="4"/><ellipse cx="1450" cy="716" rx="6" ry="4"/>
  </g>
  <!-- flyers swooping at the flame -->
  <g fill="#2a1d40">
    <path d="M330 420 Q370 370 410 410 Q450 370 490 420 Q450 410 410 432 Q370 410 330 420 Z"/>
    <path d="M1110 380 Q1150 330 1190 370 Q1230 330 1270 380 Q1230 370 1190 392 Q1150 370 1110 380 Z"/>
  </g>
  <g fill="#d6a0ff">
    <circle cx="402" cy="414" r="4"/><circle cx="418" cy="414" r="4"/>
    <circle cx="1182" cy="374" r="4"/><circle cx="1198" cy="374" r="4"/>
  </g>
  <!-- title -->
  <g font-family="Bahnschrift, 'Segoe UI', system-ui, sans-serif" font-weight="900" text-anchor="middle">
    <text x="800" y="160" font-size="140" fill="none" stroke="#1e0f2e" stroke-width="22" stroke-linejoin="round" letter-spacing="6">LAST LIGHT</text>
    <text x="800" y="160" font-size="140" fill="url(#title)" letter-spacing="6">LAST LIGHT</text>
  </g>
</svg>
