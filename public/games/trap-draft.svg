<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e5c8a"/><stop offset="1" stop-color="#1f4263"/></linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="2"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <g fill="none" stroke="#f4ecd8" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="14 10"><circle cx="360" cy="230" r="70"/><circle cx="360" cy="230" r="32"/><circle cx="1280" cy="190" r="48"/></g>
  <g stroke="#2a2118" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- start plank -->
    <rect x="30" y="640" width="470" height="300" rx="10" fill="#c9925a"/>
    <path d="M60 700 Q250 680 470 700 M60 770 Q250 790 470 770" fill="none" stroke="#8a5a35" stroke-opacity="0.5" stroke-width="4"/>
    <!-- book stack -->
    <rect x="640" y="560" width="300" height="70" rx="6" fill="#c44536"/><rect x="640" y="630" width="300" height="70" rx="6" fill="#3f7d5a"/><rect x="640" y="700" width="300" height="70" rx="6" fill="#d99a2b"/><rect x="640" y="770" width="300" height="130" rx="6" fill="#2f6e8f"/>
    <rect x="920" y="570" width="18" height="50" fill="#e6b8a2" stroke-width="3"/><rect x="920" y="640" width="18" height="50" fill="#cfe3c8" stroke-width="3"/><rect x="920" y="710" width="18" height="50" fill="#f3e1a8" stroke-width="3"/>
    <!-- ruler -->
    <rect x="1040" y="430" width="260" height="38" rx="5" fill="#f0d27a"/>
    <path d="M1070 430v16M1100 430v22M1130 430v16M1160 430v22M1190 430v16M1220 430v22M1250 430v16" stroke-width="4"/>
    <!-- exit plank and toy box -->
    <rect x="1330" y="640" width="260" height="300" rx="10" fill="#c9925a"/>
    <rect x="1370" y="470" width="190" height="170" fill="#d94c3d"/><rect x="1400" y="480" width="26" height="160" fill="#f2c230" stroke-width="0"/><rect x="1500" y="480" width="26" height="160" fill="#f2c230" stroke-width="0"/>
    <path d="M1350 470 L1580 470 L1560 410 L1370 410 Z" fill="#f2c230"/>
    <!-- spring trap -->
    <ellipse cx="780" cy="535" rx="40" ry="10" fill="none" stroke-width="12"/><ellipse cx="780" cy="535" rx="40" ry="10" fill="none" stroke="#dfe5ea" stroke-width="5"/>
    <ellipse cx="780" cy="510" rx="40" ry="10" fill="none" stroke-width="12"/><ellipse cx="780" cy="510" rx="40" ry="10" fill="none" stroke="#dfe5ea" stroke-width="5"/>
    <rect x="735" y="470" width="90" height="24" rx="8" fill="#f4ecd8"/>
    <!-- glove trap -->
    <rect x="1085" y="372" width="76" height="58" rx="8" fill="#e8b84a"/><path d="M1125 380 L1190 360" stroke-width="12"/><circle cx="1210" cy="356" r="34" fill="#d94c3d"/><ellipse cx="1222" cy="344" rx="14" ry="9" fill="#fff" fill-opacity="0.4" stroke="none"/>
    <!-- vanishing floor over the gap -->
    <rect x="520" y="640" width="100" height="50" fill="#c8a26a" transform="rotate(8 570 665)"/><path d="M520 665 h100" stroke="#f4ecd8" stroke-width="16" transform="rotate(8 570 665)"/>
    <!-- toys: robot, duck, frog -->
    <rect x="95" y="520" width="90" height="82" fill="#e8453c"/><rect x="105" y="462" width="70" height="60" fill="#c8d0d6"/><circle cx="127" cy="492" r="9" fill="#f4ecd8"/><circle cx="155" cy="492" r="9" fill="#f4ecd8"/><path d="M140 462v-26" /><circle cx="140" cy="430" r="9" fill="#d94c3d"/>
    <ellipse cx="340" cy="580" rx="58" ry="46" fill="#3c8de8"/><circle cx="388" cy="528" r="34" fill="#3c8de8"/><path d="M412 528 L446 536 L412 546 Z" fill="#f0a030"/><circle cx="398" cy="520" r="7" fill="#f4ecd8"/>
  </g>
  <g stroke="#2a2118" stroke-width="6" stroke-linejoin="round">
    <ellipse cx="860" cy="360" rx="58" ry="42" fill="#46c25a"/><ellipse cx="830" cy="322" rx="20" ry="20" fill="#46c25a"/><ellipse cx="890" cy="322" rx="20" ry="20" fill="#46c25a"/><circle cx="830" cy="320" r="9" fill="#f4ecd8"/><circle cx="890" cy="320" r="9" fill="#f4ecd8"/>
  </g>
  <rect x="440" y="780" width="720" height="86" rx="43" fill="#14202e" fill-opacity="0.75"/>
  <text x="800" y="840" font-family="system-ui, sans-serif" font-weight="800" font-size="62" text-anchor="middle" fill="#f4ecd8" stroke="#2a2118" stroke-width="10" paint-order="stroke">TRAP DRAFT</text>
</svg>
