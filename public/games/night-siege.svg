<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Night Siege</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f2a"/>
      <stop offset="0.55" stop-color="#161a3d"/>
      <stop offset="1" stop-color="#241a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="800" cy="610" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb14a" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#ff7a2f" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="1290" cy="170" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9ecff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e9ecff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grass" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#1b2b22"/>
      <rect x="4" y="6" width="4" height="4" fill="#22372b"/>
      <rect x="20" y="18" width="4" height="4" fill="#22372b"/>
      <rect x="12" y="26" width="4" height="2" fill="#162219"/>
    </pattern>
    <g id="zombie">
      <rect x="-14" y="-46" width="28" height="26" fill="#3d5a3a"/>
      <rect x="-9" y="-40" width="5" height="5" fill="#e33"/>
      <rect x="4" y="-40" width="5" height="5" fill="#e33"/>
      <rect x="-16" y="-20" width="32" height="30" fill="#2c3d2b"/>
      <rect x="-30" y="-18" width="16" height="8" fill="#3d5a3a"/>
      <rect x="14" y="-18" width="16" height="8" fill="#3d5a3a"/>
      <rect x="-14" y="10" width="11" height="22" fill="#24301f"/>
      <rect x="3" y="10" width="11" height="22" fill="#24301f"/>
    </g>
    <g id="survivor">
      <rect x="-12" y="-44" width="24" height="22" fill="#f1c9a0"/>
      <rect x="-12" y="-48" width="24" height="8" fill="#3a2a1e"/>
      <rect x="-14" y="-22" width="28" height="30" fill="currentColor"/>
      <rect x="-12" y="8" width="10" height="20" fill="#2b2f3a"/>
      <rect x="2" y="8" width="10" height="20" fill="#2b2f3a"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1290" cy="170" r="190" fill="url(#moonGlow)"/>
  <circle cx="1290" cy="170" r="70" fill="#eef0ff"/>
  <circle cx="1268" cy="150" r="12" fill="#d6daf2"/>
  <circle cx="1312" cy="196" r="9" fill="#d6daf2"/>
  <g fill="#ffffff" opacity="0.7">
    <rect x="160" y="90" width="4" height="4"/><rect x="420" y="60" width="3" height="3"/>
    <rect x="610" y="140" width="4" height="4"/><rect x="880" y="70" width="3" height="3"/>
    <rect x="1040" y="120" width="4" height="4"/><rect x="1480" y="80" width="3" height="3"/>
    <rect x="300" y="200" width="3" height="3"/><rect x="1500" y="260" width="4" height="4"/>
  </g>

  <!-- The ground: a top-down field seen at an angle. -->
  <path d="M0 470 L1600 430 L1600 900 L0 900 Z" fill="url(#grass)"/>
  <path d="M0 470 L1600 430 L1600 900 L0 900 Z" fill="#0a0d1c" opacity="0.35"/>

  <!-- Walls the team built around the fire. -->
  <g fill="#7a5a3a" stroke="#3d2b1b" stroke-width="4">
    <rect x="560" y="520" width="56" height="40"/><rect x="616" y="520" width="56" height="40"/>
    <rect x="928" y="520" width="56" height="40"/><rect x="984" y="520" width="56" height="40"/>
    <rect x="520" y="700" width="56" height="40"/><rect x="1024" y="700" width="56" height="40"/>
  </g>
  <g fill="#9aa3ad">
    <polygon points="700,760 712,736 724,760"/><polygon points="724,760 736,736 748,760"/>
    <polygon points="852,760 864,736 876,760"/><polygon points="876,760 888,736 900,760"/>
  </g>

  <!-- The campfire and its light. -->
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g transform="translate(800 640)">
    <rect x="-34" y="10" width="68" height="12" fill="#5a3a22"/>
    <rect x="-26" y="2" width="52" height="10" fill="#6e4a2c"/>
    <polygon points="-22,6 0,-58 22,6" fill="#ff7a2f"/>
    <polygon points="-12,6 2,-38 14,6" fill="#ffd23f"/>
  </g>

  <!-- Survivors in seat colours, back to back. -->
  <g transform="translate(690 640)" color="#ff5d73"><use href="#survivor"/></g>
  <g transform="translate(910 640)" color="#3ec1ff"><use href="#survivor"/></g>
  <g transform="translate(760 760)" color="#ffd23f"><use href="#survivor"/></g>
  <g transform="translate(850 760)" color="#7ee081"><use href="#survivor"/></g>
  <!-- Muzzle flash and a shot towards the dark. -->
  <rect x="922" y="608" width="230" height="4" fill="#ffe7a3" opacity="0.8"/>
  <polygon points="926,600 946,610 926,620" fill="#fff3c4"/>

  <!-- The wave closing in. -->
  <g opacity="0.95">
    <use href="#zombie" transform="translate(240 600) scale(1.1)"/>
    <use href="#zombie" transform="translate(340 690) scale(1.25)"/>
    <use href="#zombie" transform="translate(150 760) scale(1.4)"/>
    <use href="#zombie" transform="translate(1190 600) scale(1.1)"/>
    <use href="#zombie" transform="translate(1290 700) scale(1.3)"/>
    <use href="#zombie" transform="translate(1440 790) scale(1.5)"/>
    <use href="#zombie" transform="translate(440 560) scale(0.9)"/>
    <use href="#zombie" transform="translate(1100 540) scale(0.9)"/>
  </g>
  <rect y="0" width="1600" height="900" fill="#05060f" opacity="0.18"/>

  <!-- Title. -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <text x="800" y="250" font-size="150" fill="#0a0b14" opacity="0.8">NIGHT SIEGE</text>
    <text x="796" y="244" font-size="150" fill="#ffd23f" letter-spacing="6">NIGHT SIEGE</text>
    <text x="800" y="320" font-size="40" fill="#e8ecff" font-weight="600" letter-spacing="3">FIVE NIGHTS · HOLD THE FIRE · TOGETHER</text>
  </g>
</svg>
