<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a3c"/>
      <stop offset="1" stop-color="#040814"/>
    </linearGradient>
    <radialGradient id="ice" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#1f5381"/>
      <stop offset="0.65" stop-color="#123257"/>
      <stop offset="1" stop-color="#0a1d38"/>
    </radialGradient>
    <linearGradient id="shard" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5aaadc"/>
      <stop offset="0.5" stop-color="#e8fbff"/>
      <stop offset="1" stop-color="#7cc8f0"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#d9f8ff"/>
      <stop offset="1" stop-color="#4fb8e0"/>
    </radialGradient>
    <linearGradient id="trail" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7fe8ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7fe8ff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7fe8ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- aurora -->
  <path d="M0 250 C300 170 520 300 820 220 S1340 140 1600 230 V0 H0Z" fill="#5adcc8" opacity="0.07"/>
  <path d="M0 180 C260 120 600 230 900 150 S1380 90 1600 160 V0 H0Z" fill="#8a7cff" opacity="0.08"/>
  <g fill="#dff2ff" opacity="0.6">
    <rect x="120" y="320" width="3" height="3"/><rect x="260" y="610" width="2" height="2"/><rect x="1380" y="380" width="3" height="3"/>
    <rect x="1480" y="700" width="2" height="2"/><rect x="200" y="820" width="3" height="3"/><rect x="1300" y="820" width="2" height="2"/>
    <rect x="90" y="500" width="2" height="2"/><rect x="1530" y="520" width="3" height="3"/><rect x="380" y="380" width="2" height="2"/>
  </g>

  <!-- the rink: a hexagon of ice -->
  <polygon points="965,806 635,806 470,520 635,234 965,234 1130,520" fill="url(#ice)"/>
  <g stroke="#a0dcff" stroke-opacity="0.14" stroke-width="3" stroke-dasharray="12 14">
    <line x1="800" y1="520" x2="965" y2="806"/><line x1="800" y1="520" x2="635" y2="806"/><line x1="800" y1="520" x2="470" y2="520"/>
    <line x1="800" y1="520" x2="635" y2="234"/><line x1="800" y1="520" x2="965" y2="234"/><line x1="800" y1="520" x2="1130" y2="520"/>
  </g>
  <circle cx="800" cy="520" r="120" fill="none" stroke="#a0dcff" stroke-opacity="0.22" stroke-width="5"/>
  <circle cx="800" cy="520" r="34" fill="none" stroke="#a0dcff" stroke-opacity="0.3" stroke-width="5"/>

  <!-- live edges in seat colours -->
  <g stroke-width="8" stroke-linecap="round" filter="url(#glow)" opacity="0.75">
    <line x1="965" y1="806" x2="635" y2="806" stroke="#ff5a6e"/>
    <line x1="635" y1="806" x2="470" y2="520" stroke="#ffd23f"/>
    <line x1="1130" y1="520" x2="965" y2="806" stroke="#5dff8a"/>
    <line x1="635" y1="234" x2="965" y2="234" stroke="#4fa3ff"/>
  </g>

  <!-- crystal walls: a band and shards standing outward -->
  <g>
    <line x1="470" y1="520" x2="635" y2="234" stroke="#aaebff" stroke-opacity="0.6" stroke-width="16" stroke-linecap="round"/>
    <line x1="965" y1="234" x2="1130" y2="520" stroke="#aaebff" stroke-opacity="0.6" stroke-width="16" stroke-linecap="round"/>
    <g fill="url(#shard)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" filter="url(#glow)">
      <polygon points="486,474 466,452 448,404 488,446 500,482"/>
      <polygon points="514,430 498,398 486,330 524,388 530,438"/>
      <polygon points="544,378 534,352 528,300 556,344 560,388"/>
      <polygon points="572,330 556,296 540,234 586,290 588,340"/>
      <polygon points="602,278 594,254 592,214 614,248 616,286"/>
      <polygon points="998,278 986,248 984,214 1006,254 1014,286"/>
      <polygon points="1028,330 1014,290 1016,240 1044,296 1044,340"/>
      <polygon points="1056,378 1044,344 1048,296 1066,352 1072,388"/>
      <polygon points="1086,430 1076,388 1088,326 1102,398 1102,438"/>
      <polygon points="1114,474 1112,446 1130,400 1134,452 1124,482"/>
    </g>
  </g>

  <!-- paddles -->
  <g filter="url(#glow)" stroke="#ffffff" stroke-width="3">
    <rect x="736" y="778" width="128" height="22" rx="11" fill="#ff5a6e"/>
    <rect x="806" y="240" width="128" height="22" rx="11" fill="#4fa3ff"/>
    <rect x="-64" y="-11" width="128" height="22" rx="11" fill="#ffd23f" transform="translate(566 650) rotate(60)"/>
    <rect x="-64" y="-11" width="128" height="22" rx="11" fill="#5dff8a" transform="translate(1024 672) rotate(-60)"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">
    <circle cx="800" cy="789" r="14" fill="#ff5a6e" stroke="#fff" stroke-width="2"/><text x="800" y="796">1</text>
    <circle cx="566" cy="650" r="14" fill="#ffd23f" stroke="#fff" stroke-width="2"/><text x="566" y="657">2</text>
    <circle cx="870" cy="251" r="14" fill="#4fa3ff" stroke="#fff" stroke-width="2"/><text x="870" y="258">3</text>
    <circle cx="1024" cy="672" r="14" fill="#5dff8a" stroke="#fff" stroke-width="2"/><text x="1024" y="679">4</text>
  </g>

  <!-- the puck, curving in from a bump -->
  <path d="M990 700 Q900 560 760 470" fill="none" stroke="url(#trail)" stroke-width="26" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <polygon points="790,470 775,496 745,496 730,470 745,444 775,444" fill="url(#gem)" stroke="#1a4a70" stroke-width="3"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.7" stroke-width="2">
    <line x1="790" y1="470" x2="773" y2="470"/><line x1="745" y1="444" x2="753" y2="458"/><line x1="745" y1="496" x2="753" y2="482"/>
  </g>
  <!-- ice chips where it left the green paddle -->
  <g fill="#bff4ff">
    <rect x="1000" y="660" width="8" height="8" transform="rotate(20 1004 664)"/>
    <rect x="1018" y="640" width="6" height="6"/>
    <rect x="984" y="640" width="7" height="7" transform="rotate(40 987 643)"/>
  </g>

  <!-- title at the top (the shelf puts its own label at the bottom) -->
  <text x="800" y="128" text-anchor="middle" font-family="Segoe UI, Arial Rounded MT Bold, Arial, sans-serif" font-weight="900" font-size="118" letter-spacing="6" fill="url(#title)" stroke="#0a1a3a" stroke-width="10" paint-order="stroke">SHARD RINK</text>
</svg>
