<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9cf2"/>
      <stop offset="0.5" stop-color="#8fd3ff"/>
      <stop offset="0.8" stop-color="#fff0c8"/>
      <stop offset="1" stop-color="#ffe0a6"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.3" stop-color="#fff2c0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff2c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="storm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#160c2e"/>
      <stop offset="0.7" stop-color="#2d1757"/>
      <stop offset="1" stop-color="#4a2a86"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46207a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#46207a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.5" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff8a2e"/>
    </linearGradient>
    <pattern id="dirt" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#cf8d4a"/>
      <rect width="50" height="50" fill="#d99a55"/>
      <rect x="50" y="50" width="50" height="50" fill="#d99a55"/>
    </pattern>
    <pattern id="check" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#ffffff"/>
      <rect width="20" height="20" fill="#1c2340"/>
      <rect x="20" y="20" width="20" height="20" fill="#1c2340"/>
    </pattern>
  </defs>

  <!-- sky, sun, clouds -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1240" cy="250" r="260" fill="url(#sun)"/>
  <circle cx="1240" cy="250" r="66" fill="#fffbe8"/>
  <g fill="#ffffff" opacity="0.92">
    <circle cx="300" cy="300" r="40"/><circle cx="350" cy="280" r="52"/><circle cx="405" cy="300" r="40"/>
    <rect x="270" y="300" width="170" height="30" rx="15"/>
    <circle cx="960" cy="330" r="30"/><circle cx="1000" cy="312" r="40"/><circle cx="1042" cy="330" r="30"/>
    <rect x="938" y="330" width="130" height="24" rx="12"/>
  </g>

  <!-- the pastel city on the horizon -->
  <g fill="#a9c2ec">
    <rect x="420" y="430" width="70" height="160"/><rect x="500" y="380" width="56" height="210"/>
    <rect x="566" y="460" width="90" height="130"/><rect x="666" y="400" width="60" height="190"/>
    <rect x="1080" y="420" width="80" height="170"/><rect x="1170" y="370" width="60" height="220"/>
    <rect x="1240" y="450" width="100" height="140"/><rect x="1350" y="410" width="70" height="180"/>
  </g>
  <g fill="#ffffff" opacity="0.45">
    <rect x="512" y="400" width="10" height="14"/><rect x="532" y="400" width="10" height="14"/><rect x="512" y="430" width="10" height="14"/>
    <rect x="1182" y="390" width="10" height="14"/><rect x="1202" y="390" width="10" height="14"/><rect x="1182" y="420" width="10" height="14"/>
  </g>

  <!-- hills, a windmill, hedge and fence -->
  <path d="M0 560 C 200 470 380 520 560 560 S 900 460 1100 520 S 1450 470 1600 530 L1600 900 L0 900 Z" fill="#9ed97a"/>
  <g transform="translate(1000 500)" fill="#f6f1e4" stroke="#f6f1e4">
    <path d="M-9 30 L-4 -70 L4 -70 L9 30 Z" stroke="none"/>
    <g stroke-width="6" stroke-linecap="round"><path d="M0 -70 L44 -100"/><path d="M0 -70 L-30 -110"/><path d="M0 -70 L-44 -40"/><path d="M0 -70 L30 -30"/></g>
  </g>
  <path d="M0 640 C 260 580 520 620 800 650 S 1300 590 1600 630 L1600 900 L0 900 Z" fill="#6cc354"/>
  <g fill="#3f9a3c">
    <circle cx="210" cy="620" r="34"/><circle cx="620" cy="630" r="30"/><circle cx="1380" cy="610" r="34"/>
  </g>
  <rect x="0" y="690" width="1600" height="40" fill="#45a347"/>
  <g fill="#fbf6ea">
    <rect x="0" y="690" width="1600" height="8"/>
    <rect x="0" y="712" width="1600" height="8"/>
  </g>

  <!-- the track: ground blocks with a pit and a high step -->
  <g>
    <rect x="0" y="740" width="700" height="160" fill="url(#dirt)"/>
    <rect x="860" y="740" width="300" height="160" fill="url(#dirt)"/>
    <rect x="1160" y="640" width="440" height="260" fill="url(#dirt)"/>
    <rect x="0" y="734" width="704" height="22" rx="6" fill="#4fc23f"/>
    <rect x="856" y="734" width="308" height="22" rx="6" fill="#4fc23f"/>
    <rect x="1156" y="634" width="444" height="22" rx="6" fill="#4fc23f"/>
    <rect x="0" y="734" width="704" height="6" fill="#9bf07a"/>
    <rect x="856" y="734" width="308" height="6" fill="#9bf07a"/>
    <rect x="1156" y="634" width="444" height="6" fill="#9bf07a"/>
    <rect x="700" y="760" width="160" height="140" fill="#1c183c" opacity="0.55"/>
    <rect x="1160" y="656" width="10" height="84" fill="#5a3214" opacity="0.4"/>
  </g>

  <!-- a hop board -->
  <g transform="translate(640 560)">
    <rect width="200" height="34" rx="12" fill="#ffd23f"/>
    <rect x="10" y="4" width="180" height="6" fill="#ffeb99"/>
    <g fill="#ff7a2e"><path d="M22 10 h12 l10 10 l-10 10 h-12 l10 -10 z"/><path d="M72 10 h12 l10 10 l-10 10 h-12 l10 -10 z"/><path d="M122 10 h12 l10 10 l-10 10 h-12 l10 -10 z"/></g>
  </g>

  <!-- the lap post -->
  <g transform="translate(1440 634)">
    <rect x="-7" y="-330" width="14" height="330" fill="#ffffff"/>
    <g fill="#ff4d6d"><rect x="-7" y="-300" width="14" height="24"/><rect x="-7" y="-250" width="14" height="24"/><rect x="-7" y="-200" width="14" height="24"/><rect x="-7" y="-150" width="14" height="24"/><rect x="-7" y="-100" width="14" height="24"/><rect x="-7" y="-50" width="14" height="24"/></g>
    <rect x="7" y="-330" width="140" height="80" fill="url(#check)"/>
  </g>

  <!-- runners -->
  <g transform="translate(300 734)">
    <ellipse cx="0" cy="4" rx="34" ry="8" fill="#000" opacity="0.2"/>
    <path d="M-10 -40 Q -40 -48 -70 -36" stroke="#ff9d9d" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M-6 -22 L -22 -4" stroke="#1c2340" stroke-width="10" stroke-linecap="round"/>
    <path d="M6 -22 L 22 -6" stroke="#1c2340" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="-24" cy="-2" rx="10" ry="6" fill="#fff"/><ellipse cx="26" cy="-4" rx="10" ry="6" fill="#fff"/>
    <rect x="-22" y="-64" width="44" height="42" rx="16" fill="#ff5d5d"/>
    <rect x="-22" y="-44" width="44" height="6" fill="#fff" opacity="0.85"/>
    <circle cx="6" cy="-80" r="20" fill="#ffc2c2"/>
    <rect x="-14" y="-92" width="40" height="8" fill="#fff"/>
    <ellipse cx="14" cy="-77" rx="7" ry="8" fill="#fff"/><circle cx="17" cy="-76" r="4" fill="#1c2340"/>
  </g>
  <g transform="translate(790 470) rotate(-8)">
    <path d="M-10 -40 Q -40 -30 -70 -50" stroke="#9ec5ff" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M-6 -22 L -24 -16" stroke="#1c2340" stroke-width="10" stroke-linecap="round"/>
    <path d="M6 -22 L 24 -28" stroke="#1c2340" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="-28" cy="-14" rx="10" ry="6" fill="#fff"/><ellipse cx="28" cy="-28" rx="10" ry="6" fill="#fff"/>
    <rect x="-22" y="-64" width="44" height="42" rx="16" fill="#3b82f6"/>
    <rect x="-22" y="-44" width="44" height="6" fill="#fff" opacity="0.85"/>
    <circle cx="6" cy="-80" r="20" fill="#c4dbff"/>
    <rect x="-14" y="-92" width="40" height="8" fill="#fff"/>
    <ellipse cx="14" cy="-77" rx="7" ry="8" fill="#fff"/><circle cx="17" cy="-76" r="4" fill="#1c2340"/>
  </g>
  <g transform="translate(1000 734)">
    <ellipse cx="0" cy="4" rx="34" ry="8" fill="#000" opacity="0.2"/>
    <path d="M-10 -40 Q -40 -50 -70 -40" stroke="#a7f3c0" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M-6 -22 L -18 -2" stroke="#1c2340" stroke-width="10" stroke-linecap="round"/>
    <path d="M6 -22 L 26 -10" stroke="#1c2340" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="-20" cy="0" rx="10" ry="6" fill="#fff"/><ellipse cx="30" cy="-8" rx="10" ry="6" fill="#fff"/>
    <rect x="-22" y="-64" width="44" height="42" rx="16" fill="#22c55e"/>
    <rect x="-22" y="-44" width="44" height="6" fill="#fff" opacity="0.85"/>
    <circle cx="6" cy="-80" r="20" fill="#c2f5d2"/>
    <rect x="-14" y="-92" width="40" height="8" fill="#fff"/>
    <ellipse cx="14" cy="-77" rx="7" ry="8" fill="#fff"/><circle cx="17" cy="-76" r="4" fill="#1c2340"/>
  </g>
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <path d="M200 680 h-60"/><path d="M190 700 h-80"/><path d="M700 430 h-70"/><path d="M690 450 h-90"/><path d="M900 690 h-60"/>
  </g>

  <!-- the storm front on the left -->
  <rect x="150" y="0" width="260" height="900" fill="url(#haze)"/>
  <path d="M0 0 H150 C 190 80 120 160 170 240 S 120 400 175 480 S 120 640 168 720 S 140 860 150 900 H0 Z" fill="url(#storm)"/>
  <g fill="#54349a">
    <circle cx="150" cy="80" r="44"/><circle cx="135" cy="210" r="52"/><circle cx="160" cy="350" r="40"/>
    <circle cx="140" cy="480" r="56"/><circle cx="158" cy="620" r="44"/><circle cx="136" cy="760" r="52"/>
  </g>
  <path d="M190 0 C 230 80 160 160 210 240 S 160 400 215 480 S 160 640 208 720 S 180 860 190 900" stroke="#cdaaff" stroke-width="6" fill="none"/>
  <path d="M60 120 L 100 240 L 70 260 L 110 400" stroke="#ffffff" stroke-width="7" fill="none" stroke-linejoin="round"/>
  <g stroke="#c8beff" stroke-width="3" opacity="0.5">
    <path d="M30 300 l-10 28"/><path d="M80 520 l-10 28"/><path d="M40 680 l-10 28"/><path d="M110 600 l-10 28"/>
  </g>

  <!-- title -->
  <g font-family="Bahnschrift, 'Segoe UI', system-ui, sans-serif" font-weight="900" text-anchor="middle" font-style="italic">
    <text x="840" y="170" font-size="150" fill="none" stroke="#1c2340" stroke-width="22" stroke-linejoin="round" letter-spacing="6">SCROLL SPRINT</text>
    <text x="840" y="170" font-size="150" fill="url(#title)" letter-spacing="6">SCROLL SPRINT</text>
  </g>
</svg>
