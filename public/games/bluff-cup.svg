<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#341d11"/>
      <stop offset="1" stop-color="#170b05"/>
    </linearGradient>
    <radialGradient id="felt" cx="0.5" cy="0.55" r="0.65">
      <stop offset="0" stop-color="#a42c31"/>
      <stop offset="1" stop-color="#430d13"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f4b25"/>
      <stop offset="1" stop-color="#46240f"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2312"/>
      <stop offset="0.4" stop-color="#8e4a26"/>
      <stop offset="0.56" stop-color="#ac5d30"/>
      <stop offset="1" stop-color="#3e1c0e"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e3d7bf"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d27e"/>
      <stop offset="0.5" stop-color="#b07a26"/>
      <stop offset="1" stop-color="#e4b75a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffb43c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#ffc878" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#wood)"/>
  <g stroke="#000" stroke-opacity="0.25" stroke-width="3">
    <line x1="260" y1="0" x2="260" y2="900"/><line x1="560" y1="0" x2="560" y2="900"/>
    <line x1="1040" y1="0" x2="1040" y2="900"/><line x1="1340" y1="0" x2="1340" y2="900"/>
  </g>
  <rect x="40" y="250" width="1520" height="640" rx="250" fill="url(#rail)"/>
  <rect x="64" y="274" width="1472" height="592" rx="226" fill="url(#felt)"/>
  <rect x="84" y="294" width="1432" height="552" rx="206" fill="none" stroke="#ffd378" stroke-opacity="0.35" stroke-width="4"/>

  <rect width="1600" height="900" fill="url(#lamp)"/>

  <!-- title -->
  <text x="800" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="150" fill="#ffd34d" stroke="#3a1a08" stroke-width="14" paint-order="stroke" letter-spacing="6">BLUFF CUP</text>
  <text x="800" y="222" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="44" fill="#fff4e2">Hide your dice. Raise the bid. Call the liar.</text>

  <!-- left cup, closed, blue band -->
  <g transform="translate(330 700)">
    <ellipse cx="0" cy="8" rx="132" ry="22" fill="#000" opacity="0.35"/>
    <path d="M-120 0 L-88 -236 Q0 -260 88 -236 L120 0 Q0 20 -120 0 Z" fill="url(#leather)" stroke="#24100a" stroke-width="5"/>
    <path d="M-114 -92 Q0 -72 114 -92 L110 -140 Q0 -120 -110 -140 Z" fill="#3a8fe0"/>
    <path d="M-110 -40 Q0 -26 110 -40" fill="none" stroke="#f0c890" stroke-width="4" stroke-dasharray="12 10"/>
    <path d="M-92 -200 Q0 -186 92 -200" fill="none" stroke="#f0c890" stroke-width="4" stroke-dasharray="12 10"/>
    <ellipse cx="0" cy="-242" rx="88" ry="16" fill="#2e140a"/>
    <path d="M-120 0 Q0 20 120 0" fill="none" stroke="#d9a84a" stroke-width="9"/>
  </g>

  <!-- right cup, lifted and tipping, green band, dice below -->
  <g transform="translate(1260 540) rotate(18)">
    <path d="M-110 0 L-80 -216 Q0 -238 80 -216 L110 0 Q0 18 -110 0 Z" fill="url(#leather)" stroke="#24100a" stroke-width="5"/>
    <path d="M-104 -84 Q0 -66 104 -84 L100 -128 Q0 -110 -100 -128 Z" fill="#45c46b"/>
    <path d="M-110 0 Q0 18 110 0" fill="none" stroke="#d9a84a" stroke-width="9"/>
  </g>
  <g>
    <circle cx="1180" cy="760" r="90" fill="url(#glow)"/>
    <circle cx="1310" cy="760" r="90" fill="url(#glow)"/>
    <g transform="translate(1180 760) rotate(-8)">
      <rect x="-56" y="-56" width="112" height="112" rx="20" fill="url(#die)" stroke="#ffd34d" stroke-width="7"/>
      <g fill="#1e1a22"><circle cx="-28" cy="-28" r="10"/><circle cx="28" cy="-28" r="10"/><circle cx="0" cy="0" r="10"/><circle cx="-28" cy="28" r="10"/><circle cx="28" cy="28" r="10"/></g>
    </g>
    <g transform="translate(1310 760) rotate(10)">
      <rect x="-56" y="-56" width="112" height="112" rx="20" fill="url(#die)" stroke="#ffd34d" stroke-width="7"/>
      <circle cx="0" cy="0" r="14" fill="#b8261c"/>
    </g>
    <g transform="translate(1440 770) rotate(-4)" opacity="0.5">
      <rect x="-50" y="-50" width="100" height="100" rx="18" fill="url(#die)" stroke="#3a3036" stroke-width="5"/>
      <g fill="#1e1a22"><circle cx="-25" cy="-25" r="9"/><circle cx="25" cy="25" r="9"/></g>
    </g>
  </g>

  <!-- the placard -->
  <g transform="translate(800 560)">
    <rect x="-250" y="-110" width="500" height="220" rx="30" fill="#000" opacity="0.35" transform="translate(6 10)"/>
    <rect x="-250" y="-110" width="500" height="220" rx="30" fill="url(#brass)"/>
    <rect x="-236" y="-96" width="472" height="192" rx="22" fill="#3a2010"/>
    <text x="0" y="-48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="30" fill="#ffd34d">BID TO BEAT</text>
    <text x="-30" y="58" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="104" fill="#fff4e2" stroke="#1a0a04" stroke-width="10" paint-order="stroke">4 ×</text>
    <g transform="translate(60 22)">
      <rect x="-46" y="-46" width="92" height="92" rx="17" fill="url(#die)" stroke="#3a3036" stroke-width="5"/>
      <g fill="#1e1a22"><circle cx="-23" cy="-23" r="8.5"/><circle cx="23" cy="-23" r="8.5"/><circle cx="0" cy="0" r="8.5"/><circle cx="-23" cy="23" r="8.5"/><circle cx="23" cy="23" r="8.5"/></g>
    </g>
  </g>

  <!-- LIAR burst -->
  <g transform="translate(600 360) rotate(-8)">
    <polygon points="0,-78 34,-56 90,-70 82,-26 150,-14 96,12 128,52 66,50 42,84 0,56 -42,84 -66,50 -128,52 -96,12 -150,-14 -82,-26 -90,-70 -34,-56" fill="#e8332a" stroke="#fff1c8" stroke-width="7"/>
    <text x="0" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="62" fill="#fff8e6" stroke="#5a0c08" stroke-width="8" paint-order="stroke">LIAR!</text>
  </g>
</svg>
