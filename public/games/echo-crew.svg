<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c30"/>
      <stop offset="0.6" stop-color="#2c2146"/>
      <stop offset="1" stop-color="#3f2c4e"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161d38"/>
      <stop offset="0.3" stop-color="#22304f"/>
      <stop offset="0.62" stop-color="#6a4670"/>
      <stop offset="0.86" stop-color="#d98b8b"/>
      <stop offset="1" stop-color="#f2c46d"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2c52"/>
      <stop offset="1" stop-color="#241b3a"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe29a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe29a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fb4ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#6fb4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c490ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#c490ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="arch"><path d="M300 640V330A500 500 0 0 1 1300 330V640Z"/></clipPath>
    <g id="gazer">
      <path d="M-34 70Q-24 0 -12 -36H12Q24 0 34 70Q17 82 0 70Q-17 82 -34 70Z" stroke="#1d1020" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-26 -22C-30 -64 -8 -86 8 -112C20 -86 34 -64 26 -22Q0 -8 -26 -22Z" stroke="#1d1020" stroke-width="5" stroke-linejoin="round"/>
      <ellipse cx="0" cy="-34" rx="19" ry="17" fill="#fff1d6" stroke="#4a3426" stroke-width="3"/>
      <circle cx="-8" cy="-36" r="3" fill="#141c30"/>
      <circle cx="8" cy="-36" r="3" fill="#141c30"/>
      <path d="M-6 -26Q0 -20 6 -26" stroke="#141c30" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="22" r="19" fill="#fff1d6" stroke="#1d1020" stroke-width="3"/>
      <path d="M8 -112l5 10 11 1-8 8 2 11-10-5-10 5 2-11-8-8 11-1z" fill="#f2c46d" stroke="#1d1020" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="url(#back)"/>
  <g stroke="#b98a3e" stroke-opacity="0.22" stroke-width="3" fill="none">
    <path d="M800 120Q650 360 120 900M800 120Q720 380 460 900M800 120Q800 400 800 900M800 120Q880 380 1140 900M800 120Q950 360 1480 900"/>
  </g>
  <g clip-path="url(#arch)">
