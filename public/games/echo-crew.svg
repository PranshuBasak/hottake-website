    <g fill="#fff3d2">
      <circle cx="380" cy="140" r="3"/><circle cx="520" cy="90" r="2.2"/><circle cx="650" cy="190" r="3.2"/>
      <circle cx="790" cy="110" r="2.4"/><circle cx="930" cy="70" r="3"/><circle cx="1050" cy="170" r="2.2"/>
      <circle cx="1180" cy="100" r="3.4"/><circle cx="450" cy="260" r="2"/><circle cx="1230" cy="260" r="2.4"/>
      <circle cx="590" cy="40" r="2"/><circle cx="1130" cy="30" r="2.2"/><circle cx="860" cy="250" r="2"/>
    </g>
    <g filter="url(#soft)" opacity="0.8">
