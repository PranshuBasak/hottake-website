  <g fill="#150e24" stroke="#150e24" stroke-linecap="round">
    <path d="M1010 560L930 760M1010 560L1090 760M1010 560V770" stroke-width="16" fill="none"/>
    <g transform="translate(1010 560) rotate(-36)">
      <rect x="-180" y="-34" width="360" height="68" rx="28"/>
      <rect x="120" y="-24" width="190" height="48" rx="20"/>
      <rect x="290" y="-30" width="38" height="60" rx="12"/>
      <rect x="-100" y="-62" width="230" height="18" rx="9"/>
    </g>
  </g>
  <!-- floor -->
  <path d="M0 740H1600V900H0Z" fill="url(#stone)"/>
  <rect x="0" y="736" width="1600" height="8" fill="#e8cf9b" opacity="0.9"/>
  <rect x="0" y="744" width="1600" height="6" fill="#b98a3e" opacity="0.55"/>
  <!-- plates: blue for players, purple for ghosts -->
  <ellipse cx="420" cy="742" rx="62" ry="12" fill="#c9a24a"/>
  <ellipse cx="420" cy="739" rx="46" ry="7" fill="#6fb4ff"/>
  <circle cx="420" cy="660" r="70" fill="url(#glowBlue)"/>
  <path d="M420 620l8 22 22 2-17 14 6 22-19-12-19 12 6-22-17-14 22-2z" fill="#6fb4ff" stroke="#141c30" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="1170" cy="742" rx="62" ry="12" fill="#c9a24a"/>
  <ellipse cx="1170" cy="739" rx="46" ry="7" fill="#c490ff"/>
  <circle cx="1170" cy="660" r="70" fill="url(#glowPurple)"/>
  <path d="M1170 620l8 22 22 2-17 14 6 22-19-12-19 12 6-22-17-14 22-2z" fill="#c490ff" stroke="#141c30" stroke-width="3" stroke-linejoin="round"/>
  <!-- the crew -->
  <circle cx="420" cy="620" r="150" fill="url(#glowGold)" opacity="0"/>
  <use href="#gazer" transform="translate(420 665)" fill="#e8453c"/>
  <g transform="translate(420 548)"><circle r="26" fill="#e8453c" stroke="#fff" stroke-width="4"/><text y="11" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="32" fill="#fff">1</text></g>
  <circle cx="810" cy="640" r="120" fill="url(#glowGold)"/>
  <use href="#gazer" transform="translate(810 665)" fill="#e9bd63" opacity="0.7"/>
  <g transform="translate(810 548)" opacity="0.9"><circle r="26" fill="#2a7de1" stroke="#fff" stroke-width="4"/><text y="11" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="32" fill="#fff">2</text></g>
  <g opacity="0.3">
    <use href="#gazer" transform="translate(940 665)" fill="#e9bd63"/>
    <use href="#gazer" transform="translate(1070 665)" fill="#e9bd63"/>
  </g>
  <circle cx="1170" cy="640" r="120" fill="url(#glowGold)"/>
  <use href="#gazer" transform="translate(1170 665)" fill="#e9bd63" opacity="0.7"/>
  <g transform="translate(1170 548)" opacity="0.9"><circle r="26" fill="#2a7de1" stroke="#fff" stroke-width="4"/><text y="11" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="32" fill="#fff">2</text></g>
  <text x="800" y="140" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-weight="800" font-size="110" fill="#f2c46d" stroke="#141c30" stroke-width="10" paint-order="stroke">Echo Crew</text>
</svg>
