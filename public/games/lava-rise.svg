<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d080b"/>
      <stop offset="0.55" stop-color="#21110f"/>
      <stop offset="1" stop-color="#5a1a0c"/>
    </linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c2430"/>
      <stop offset="0.5" stop-color="#231c27"/>
      <stop offset="1" stop-color="#17121a"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17121a"/>
      <stop offset="1" stop-color="#4a3f4e"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#17121a"/>
      <stop offset="1" stop-color="#4a3f4e"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#857688"/>
      <stop offset="0.2" stop-color="#4c4250"/>
      <stop offset="1" stop-color="#211b25"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.06" stop-color="#ffc23a"/>
      <stop offset="0.25" stop-color="#ff7417"/>
      <stop offset="0.6" stop-color="#d4300d"/>
      <stop offset="1" stop-color="#6a0f07"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6a1e" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#c83c14" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7a1a0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.45" stop-color="#ffb22e"/>
      <stop offset="1" stop-color="#ff5a14"/>
    </linearGradient>
    <radialGradient id="ember">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.35" stop-color="#ff9a30" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff5a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beam" cx="0" cy="0.5" r="1">
      <stop offset="0" stop-color="#fff1c8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff1c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- the shaft and its back wall of basalt columns -->
  <rect width="1600" height="900" fill="url(#shaft)"/>
  <g opacity="0.75">
    <rect x="70" y="0" width="86" height="900" fill="url(#col)"/>
    <rect x="160" y="0" width="64" height="900" fill="url(#col)"/>
    <rect x="228" y="0" width="102" height="900" fill="url(#col)"/>
    <rect x="334" y="0" width="74" height="900" fill="url(#col)"/>
    <rect x="412" y="0" width="92" height="900" fill="url(#col)"/>
    <rect x="508" y="0" width="60" height="900" fill="url(#col)"/>
    <rect x="572" y="0" width="98" height="900" fill="url(#col)"/>
    <rect x="674" y="0" width="80" height="900" fill="url(#col)"/>
    <rect x="758" y="0" width="70" height="900" fill="url(#col)"/>
    <rect x="832" y="0" width="104" height="900" fill="url(#col)"/>
    <rect x="940" y="0" width="66" height="900" fill="url(#col)"/>
    <rect x="1010" y="0" width="90" height="900" fill="url(#col)"/>
    <rect x="1104" y="0" width="76" height="900" fill="url(#col)"/>
    <rect x="1184" y="0" width="96" height="900" fill="url(#col)"/>
    <rect x="1284" y="0" width="62" height="900" fill="url(#col)"/>
    <rect x="1350" y="0" width="84" height="900" fill="url(#col)"/>
    <rect x="1438" y="0" width="92" height="900" fill="url(#col)"/>
  </g>
  <g stroke="#000" stroke-opacity="0.5" stroke-width="3">
    <path d="M70 210 L156 222 M160 140 L224 132 M228 330 L330 342 M334 90 L408 84 M412 260 L504 270 M508 420 L568 412 M572 160 L670 150 M674 380 L754 390 M758 230 L828 222 M832 120 L936 132 M940 300 L1006 292 M1010 200 L1100 212 M1104 350 L1180 340 M1184 110 L1280 122 M1284 280 L1346 272 M1350 190 L1434 200 M1438 330 L1530 320"/>
  </g>
  <path d="M520 120 l20 40 l-14 30 l24 44 l-10 36" fill="none" stroke="#ff6a1e" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round"/>
  <path d="M1220 60 l-18 46 l16 34 l-22 50" fill="none" stroke="#ff6a1e" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- side walls -->
  <rect x="0" y="0" width="70" height="900" fill="url(#wallL)"/>
  <rect x="1530" y="0" width="70" height="900" fill="url(#wallR)"/>
  <path d="M68 0 V900 M1532 0 V900" stroke="#ff9a50" stroke-opacity="0.55" stroke-width="4"/>
  <g stroke="#000" stroke-opacity="0.5" stroke-width="3">
    <path d="M0 120 L70 128 M0 260 L70 252 M0 410 L70 420 M0 560 L70 552 M0 700 L70 708 M1530 90 L1600 98 M1530 240 L1600 232 M1530 380 L1600 390 M1530 530 L1600 522 M1530 680 L1600 690"/>
  </g>

  <!-- ledges -->
  <g>
    <rect x="96" y="596" width="300" height="30" rx="9" fill="url(#slab)"/>
    <rect x="610" y="470" width="250" height="30" rx="9" fill="url(#slab)"/>
    <rect x="1130" y="560" width="330" height="30" rx="9" fill="url(#slab)"/>
    <rect x="300" y="330" width="210" height="30" rx="9" fill="url(#slab)"/>
    <rect x="940" y="300" width="230" height="30" rx="9" fill="url(#slab)"/>
    <rect x="1290" y="180" width="200" height="30" rx="9" fill="url(#slab)"/>
    <rect x="96" y="150" width="170" height="30" rx="9" fill="url(#slab)"/>
    <g fill="#ffb15c" fill-opacity="0.85">
      <rect x="100" y="618" width="292" height="8" rx="4"/>
      <rect x="1134" y="582" width="322" height="8" rx="4"/>
    </g>
    <g fill="#ffb15c" fill-opacity="0.35">
      <rect x="614" y="492" width="242" height="8" rx="4"/>
    </g>
    <g fill="#e6d6e2" fill-opacity="0.55">
      <rect x="104" y="597" width="284" height="3"/>
      <rect x="618" y="471" width="234" height="3"/>
      <rect x="1138" y="561" width="314" height="3"/>
      <rect x="308" y="331" width="194" height="3"/>
      <rect x="948" y="301" width="214" height="3"/>
      <rect x="1298" y="181" width="184" height="3"/>
      <rect x="104" y="151" width="154" height="3"/>
    </g>
    <g fill="#1d1820">
      <path d="M150 626 l10 0 l-5 16 z M240 626 l12 0 l-6 20 z M330 626 l10 0 l-5 14 z M660 500 l12 0 l-6 18 z M780 500 l10 0 l-5 14 z M1200 590 l12 0 l-6 20 z M1330 590 l10 0 l-5 15 z M380 360 l10 0 l-5 15 z M1010 330 l12 0 l-6 18 z M1360 210 l10 0 l-5 14 z"/>
    </g>
  </g>

  <!-- headlamp beams -->
  <g>
    <path d="M760 376 L1010 300 L1010 470 Z" fill="url(#beam)"/>
    <path d="M410 260 L170 190 L170 340 Z" fill="url(#beam)" transform="translate(0 0)"/>
    <path d="M1250 486 L1500 420 L1500 580 Z" fill="url(#beam)"/>
  </g>

  <!-- climbers -->
  <!-- blue: mid-jump between ledges -->
  <g transform="translate(740 420) rotate(-6)">
    <rect x="-34" y="-84" width="68" height="74" rx="30" fill="#3ec1ff" stroke="#14080c" stroke-width="5"/>
    <ellipse cx="-14" cy="-68" rx="10" ry="6" fill="#fff" fill-opacity="0.35"/>
    <rect x="-34" y="-76" width="68" height="10" fill="#2a2028"/>
    <circle cx="16" cy="-71" r="9" fill="#fff6d0"/>
    <ellipse cx="-6" cy="-46" rx="8" ry="10" fill="#fff"/><ellipse cx="18" cy="-46" rx="8" ry="10" fill="#fff"/>
    <circle cx="-2" cy="-49" r="4.5" fill="#1a0e12"/><circle cx="22" cy="-49" r="4.5" fill="#1a0e12"/>
    <rect x="-24" y="-16" width="17" height="18" rx="6" fill="#16536e"/><rect x="8" y="-22" width="17" height="18" rx="6" fill="#16536e"/>
  </g>
  <!-- pink: leaping up toward the top-left ledge -->
  <g transform="translate(430 270) rotate(5)">
    <rect x="-34" y="-84" width="68" height="74" rx="30" fill="#ff7ad9" stroke="#14080c" stroke-width="5"/>
    <ellipse cx="-14" cy="-68" rx="10" ry="6" fill="#fff" fill-opacity="0.35"/>
    <rect x="-34" y="-76" width="68" height="10" fill="#2a2028"/>
    <circle cx="-16" cy="-71" r="9" fill="#fff6d0"/>
    <ellipse cx="-18" cy="-46" rx="8" ry="10" fill="#fff"/><ellipse cx="6" cy="-46" rx="8" ry="10" fill="#fff"/>
    <circle cx="-22" cy="-50" r="4.5" fill="#1a0e12"/><circle cx="2" cy="-50" r="4.5" fill="#1a0e12"/>
    <rect x="-24" y="-20" width="17" height="18" rx="6" fill="#7a2a64"/><rect x="8" y="-14" width="17" height="18" rx="6" fill="#7a2a64"/>
  </g>
  <!-- yellow: standing on the right ledge -->
  <g transform="translate(1230 560)">
    <rect x="-34" y="-84" width="68" height="74" rx="30" fill="#ffd23f" stroke="#14080c" stroke-width="5"/>
    <ellipse cx="-14" cy="-68" rx="10" ry="6" fill="#fff" fill-opacity="0.35"/>
    <rect x="-34" y="-76" width="68" height="10" fill="#2a2028"/>
    <circle cx="16" cy="-71" r="9" fill="#fff6d0"/>
    <ellipse cx="-6" cy="-46" rx="8" ry="10" fill="#fff"/><ellipse cx="18" cy="-46" rx="8" ry="10" fill="#fff"/>
    <circle cx="-2" cy="-46" r="4.5" fill="#1a0e12"/><circle cx="22" cy="-46" r="4.5" fill="#1a0e12"/>
    <rect x="-24" y="-18" width="17" height="18" rx="6" fill="#7a5a10"/><rect x="8" y="-18" width="17" height="18" rx="6" fill="#7a5a10"/>
  </g>
  <!-- green: stomped and dizzy on the low ledge -->
  <g transform="translate(250 596)">
    <rect x="-34" y="-74" width="68" height="66" rx="28" fill="#7ee081" stroke="#14080c" stroke-width="5"/>
    <rect x="-34" y="-66" width="68" height="10" fill="#2a2028"/>
    <circle cx="16" cy="-61" r="9" fill="#fff6d0"/>
    <path d="M-12 -46 l10 10 M-2 -46 l-10 10 M10 -46 l10 10 M20 -46 l-10 10" stroke="#1a0e12" stroke-width="4" stroke-linecap="round"/>
    <rect x="-26" y="-16" width="18" height="16" rx="6" fill="#2f6a32"/><rect x="8" y="-16" width="18" height="16" rx="6" fill="#2f6a32"/>
    <g fill="#ffe680">
      <path d="M-40 -96 l4 9 l10 1 l-8 6 l3 10 l-9 -6 l-9 6 l3 -10 l-8 -6 l10 -1 z"/>
      <path d="M30 -104 l3 7 l8 1 l-6 5 l2 8 l-7 -5 l-7 5 l2 -8 l-6 -5 l8 -1 z"/>
    </g>
  </g>

  <!-- the lava -->
  <path d="M0 760 C 120 740 220 784 360 764 S 600 738 740 762 S 980 790 1120 760 S 1380 736 1600 758 V900 H0 Z" fill="url(#lava)"/>
  <path d="M0 760 C 120 740 220 784 360 764 S 600 738 740 762 S 980 790 1120 760 S 1380 736 1600 758" fill="none" stroke="#ff8a2a" stroke-opacity="0.55" stroke-width="16"/>
  <path d="M0 760 C 120 740 220 784 360 764 S 600 738 740 762 S 980 790 1120 760 S 1380 736 1600 758" fill="none" stroke="#fff4be" stroke-width="4"/>
  <g fill="#4a0e08" fill-opacity="0.55" stroke="#ffbe50" stroke-opacity="0.5" stroke-width="3">
    <ellipse cx="260" cy="800" rx="90" ry="14"/>
    <ellipse cx="860" cy="812" rx="120" ry="15"/>
    <ellipse cx="1350" cy="796" rx="80" ry="12"/>
  </g>
  <path d="M0 850 C 300 830 500 868 800 846 S 1300 828 1600 852" fill="none" stroke="#ffc85a" stroke-opacity="0.2" stroke-width="4"/>

  <!-- embers -->
  <g>
    <circle cx="180" cy="700" r="12" fill="url(#ember)"/>
    <circle cx="520" cy="640" r="9" fill="url(#ember)"/>
    <circle cx="610" cy="560" r="7" fill="url(#ember)"/>
    <circle cx="900" cy="690" r="14" fill="url(#ember)"/>
    <circle cx="1060" cy="600" r="8" fill="url(#ember)"/>
    <circle cx="1420" cy="680" r="11" fill="url(#ember)"/>
    <circle cx="1500" cy="520" r="7" fill="url(#ember)"/>
    <circle cx="330" cy="470" r="6" fill="url(#ember)"/>
    <circle cx="1180" cy="430" r="6" fill="url(#ember)"/>
    <circle cx="760" cy="620" r="10" fill="url(#ember)"/>
  </g>
  <rect width="1600" height="900" fill="url(#vig)"/>

  <!-- title -->
  <g font-family="Bahnschrift, 'Segoe UI', system-ui, sans-serif" font-weight="900" text-anchor="middle">
    <text x="800" y="150" font-size="150" fill="none" stroke="#1a0606" stroke-width="22" stroke-linejoin="round" letter-spacing="6">LAVA RISE</text>
    <text x="800" y="150" font-size="150" fill="url(#title)" letter-spacing="6">LAVA RISE</text>
  </g>
</svg>
