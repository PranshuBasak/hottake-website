<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1426"/>
      <stop offset="0.55" stop-color="#2d2036"/>
      <stop offset="1" stop-color="#150e18"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="relicglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a0"/>
      <stop offset="0.5" stop-color="#f2b632"/>
      <stop offset="1" stop-color="#a86a10"/>
    </linearGradient>
    <linearGradient id="daylight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe296" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffe296" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- the tunnel -->
  <rect width="1600" height="900" fill="url(#rock)"/>
  <path d="M0 0 H1600 V120 L1540 150 L1470 128 L1400 170 L1330 140 L1250 182 L1180 150 L1100 176 L1020 140 L940 168 L860 136 L780 172 L700 140 L620 176 L540 146 L460 170 L380 138 L300 164 L220 132 L140 160 L60 130 L0 150Z" fill="#3b2a26"/>
  <path d="M300 160 L318 230 L336 160Z M700 150 L716 214 L732 150Z M1100 170 L1120 250 L1140 170Z M1420 160 L1436 216 L1452 160Z" fill="#3b2a26"/>
  <rect x="0" y="0" width="230" height="900" fill="url(#daylight)"/>
  <!-- exit ladder -->
  <g stroke="#7a5230" stroke-width="12">
    <line x1="70" y1="0" x2="70" y2="700"/>
    <line x1="150" y1="0" x2="150" y2="700"/>
    <line x1="70" y1="90" x2="150" y2="90"/>
    <line x1="70" y1="190" x2="150" y2="190"/>
    <line x1="70" y1="290" x2="150" y2="290"/>
    <line x1="70" y1="390" x2="150" y2="390"/>
    <line x1="70" y1="490" x2="150" y2="490"/>
    <line x1="70" y1="590" x2="150" y2="590"/>
  </g>
  <!-- timbers and a lantern -->
  <rect x="1230" y="120" width="30" height="600" fill="#5b3a20"/>
  <rect x="1150" y="120" width="190" height="34" fill="#6e4728"/>
  <circle cx="1310" cy="230" r="120" fill="url(#lamp)"/>
  <rect x="1296" y="206" width="28" height="44" rx="6" fill="#ffcf6e"/>

  <!-- floor and rail -->
  <rect y="700" width="1600" height="200" fill="#241816"/>
  <g fill="#5e3c22">
    <rect x="40" y="712" width="70" height="20"/><rect x="160" y="712" width="70" height="20"/><rect x="280" y="712" width="70" height="20"/>
    <rect x="400" y="712" width="70" height="20"/><rect x="520" y="712" width="70" height="20"/><rect x="640" y="712" width="70" height="20"/>
    <rect x="760" y="712" width="70" height="20"/><rect x="880" y="712" width="70" height="20"/><rect x="1000" y="712" width="70" height="20"/>
    <rect x="1120" y="712" width="70" height="20"/><rect x="1240" y="712" width="70" height="20"/><rect x="1360" y="712" width="70" height="20"/>
    <rect x="1480" y="712" width="70" height="20"/>
  </g>
  <rect y="700" width="1600" height="10" fill="#9aa3ad"/>

  <!-- the tiles: gems, a hazard (bats), a relic -->
  <g transform="translate(300 400)">
    <rect width="200" height="270" rx="20" fill="#1f2a3a" stroke="#6fb6ff" stroke-width="7"/>
    <path d="M60 170 L78 140 L122 140 L140 170 L100 220Z" fill="#4fd8ff" stroke="#0e2030" stroke-width="4"/>
    <path d="M30 200 L44 178 L72 178 L86 200 L58 236Z" fill="#ff6fae" stroke="#0e2030" stroke-width="4"/>
    <path d="M114 200 L128 178 L156 178 L170 200 L142 236Z" fill="#7cf08a" stroke="#0e2030" stroke-width="4"/>
    <rect x="50" y="30" width="100" height="56" rx="16" fill="#ffd34d"/>
    <text x="100" y="72" font-family="Segoe UI, system-ui, sans-serif" font-weight="800" font-size="42" text-anchor="middle" fill="#2a1a10">11</text>
  </g>
  <g transform="translate(560 400)">
    <rect width="200" height="270" rx="20" fill="#4a1f22" stroke="#ff7a5c" stroke-width="7"/>
    <g fill="#2b1f3a" transform="translate(100 150) scale(1.8)">
      <path d="M-6 -2 Q-26 -30 -46 -18 Q-38 -12 -34 -6 Q-28 -14 -22 -6 Q-16 -14 -8 8Z"/>
      <path d="M6 -2 Q26 -30 46 -18 Q38 -12 34 -6 Q28 -14 22 -6 Q16 -14 8 8Z"/>
      <ellipse cx="0" cy="2" rx="9" ry="12"/>
      <path d="M-7 -7 L-5 -18 L-1 -9Z M7 -7 L5 -18 L1 -9Z"/>
      <circle cx="-3.5" cy="-1" r="2" fill="#ff5a4a"/><circle cx="3.5" cy="-1" r="2" fill="#ff5a4a"/>
    </g>
    <text x="100" y="56" font-family="Segoe UI, system-ui, sans-serif" font-weight="800" font-size="34" text-anchor="middle" fill="#ffc2b0">BATS</text>
  </g>
  <g transform="translate(820 400)">
    <circle cx="100" cy="140" r="130" fill="url(#relicglow)"/>
    <rect width="200" height="270" rx="20" fill="#3a2650" fill-opacity="0.85" stroke="#ffd34d" stroke-width="7"/>
    <rect x="58" y="206" width="84" height="26" rx="5" fill="#6b5a48"/>
    <ellipse cx="100" cy="170" rx="38" ry="38" fill="url(#gold)"/>
    <ellipse cx="100" cy="128" rx="34" ry="28" fill="url(#gold)"/>
    <path d="M72 116 L64 90 L88 106Z M128 116 L136 90 L112 106Z" fill="#f2b632"/>
    <circle cx="87" cy="128" r="11" fill="#fff8d8"/><circle cx="113" cy="128" r="11" fill="#fff8d8"/>
    <circle cx="87" cy="128" r="6" fill="#d42a4a"/><circle cx="113" cy="128" r="6" fill="#d42a4a"/>
    <text x="100" y="56" font-family="Segoe UI, system-ui, sans-serif" font-weight="800" font-size="34" text-anchor="middle" fill="#ffe9a0">RELIC</text>
  </g>

  <!-- a digging miner -->
  <g transform="translate(1180 470)">
    <ellipse cx="0" cy="228" rx="52" ry="12" fill="#000" fill-opacity="0.35"/>
    <path d="M-16 150 L-18 220 M16 150 L20 220" stroke="#34405a" stroke-width="24" stroke-linecap="round"/>
    <rect x="-38" y="66" width="76" height="96" rx="20" fill="#e8453c"/>
    <circle cx="0" cy="98" r="18" fill="#fff"/>
    <text x="0" y="108" font-family="Segoe UI, system-ui, sans-serif" font-weight="800" font-size="26" text-anchor="middle" fill="#1d1622">1</text>
    <path d="M30 80 L66 30" stroke="#e8453c" stroke-width="20" stroke-linecap="round"/>
    <g transform="translate(66 30) rotate(-55)">
      <line x1="0" y1="0" x2="0" y2="-100" stroke="#7a4a22" stroke-width="11" stroke-linecap="round"/>
      <path d="M-52 -66 A54 54 0 0 1 52 -66" fill="none" stroke="#b9c2cc" stroke-width="13"/>
    </g>
    <circle cx="0" cy="30" r="32" fill="#f0c08a"/>
    <path d="M-34 24 A34 34 0 0 1 34 24Z" fill="#f2b632"/>
    <rect x="-44" y="20" width="88" height="11" rx="5" fill="#f2b632"/>
    <circle cx="0" cy="4" r="12" fill="#fff6b0"/>
    <circle cx="-11" cy="38" r="4" fill="#2a1a12"/><circle cx="11" cy="38" r="4" fill="#2a1a12"/>
  </g>
  <!-- a climber on the ladder -->
  <g transform="translate(110 260)">
    <path d="M-14 120 L-18 180 M14 120 L18 170" stroke="#34405a" stroke-width="20" stroke-linecap="round"/>
    <rect x="-32" y="40" width="64" height="88" rx="18" fill="#2f7de1"/>
    <path d="M-26 50 L-36 -10 M26 50 L36 10" stroke="#2f7de1" stroke-width="16" stroke-linecap="round"/>
    <circle cx="0" cy="12" r="27" fill="#f0c08a"/>
    <path d="M-29 8 A29 29 0 0 1 29 8Z" fill="#f2b632"/>
    <text x="0" y="96" font-family="Segoe UI, system-ui, sans-serif" font-weight="800" font-size="32" text-anchor="middle" fill="#fff">2</text>
  </g>

  <!-- the cart full of gems -->
  <g transform="translate(1300 560)">
    <path d="M-10 40 L46 4 L98 4 L130 28 L180 6 L236 22 L290 40Z" fill="#4fd8ff" stroke="#0e2030" stroke-width="4"/>
    <path d="M60 30 L80 0 L110 6 L120 30Z" fill="#ffd34d" stroke="#0e2030" stroke-width="4"/>
    <path d="M180 30 L196 4 L226 8 L236 32Z" fill="#ff6fae" stroke="#0e2030" stroke-width="4"/>
    <path d="M-20 30 H300 L276 130 H4Z" fill="#7d4628"/>
    <rect x="-26" y="22" width="332" height="16" fill="#4a2a1a"/>
    <circle cx="64" cy="142" r="30" fill="#2b2b33"/><circle cx="64" cy="142" r="11" fill="#77777f"/>
    <circle cx="218" cy="142" r="30" fill="#2b2b33"/><circle cx="218" cy="142" r="11" fill="#77777f"/>
  </g>

  <!-- title -->
  <g font-family="Segoe UI Rounded, Arial Rounded MT Bold, Segoe UI, system-ui, sans-serif" font-weight="900" text-anchor="middle">
    <text x="800" y="300" font-size="190" fill="#3a2410" stroke="#3a2410" stroke-width="30" stroke-linejoin="round">DEEP DIG</text>
    <text x="800" y="300" font-size="190" fill="#ffd34d">DEEP DIG</text>
  </g>
</svg>
